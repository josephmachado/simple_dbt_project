---
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: sde_dbt_tutorial
version: 1.0.0
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: sde_dbt_tutorial

flags:
  send_anonymous_usage_stats: false

# Folders for dbt to look at 
model-paths: [models] # dbt run -> looks in this folder
analysis-paths: [analysis] # For adhoc analysis
test-paths: [tests] # dbt test -> looks for custom SQL tests in this folder
seed-paths: [data] # dbt seed -> looks for small data to be loaded in this folder
macro-paths: [macros] # looks for SQL functions to be imported
snapshot-paths: [scd2] # dbt snapshot -> looks for model specific SCD2 create logic here
target-path: target  # dbt compile / run / test -> looks for compiled SQL to run in the DB in this folder
clean-targets:  # directories to be removed by `dbt clean`
  - target
  - dbt_packages


# Configuring models
models:
  sde_dbt_tutorial:
    bronze: # + => Applies to all models in this folder
      +materialized: view
    silver:
      +materialized: table
    gold:
      marketing:
        +materialized: view

