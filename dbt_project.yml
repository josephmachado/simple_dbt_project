---
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: sde_dbt_tutorial
version: 1.0.0
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: sde_dbt_tutorial

flags:
  send_anonymous_usage_stats: false

model-paths: [models] # folder that dbt run command uses 
analysis-paths: [analysis] 
test-paths: [tests] # folder where we store custom test functions
seed-paths: [data] # folder that dbt seed command uses
macro-paths: [macros] # folder to store custom SQL fucntionss 
snapshot-paths: [scd2] # folder that dbt snapshot command uses 
target-path: target  # folder which will store compiled SQL files
clean-targets:  # directories to be removed by `dbt clean`
  - target
  - dbt_packages


# Configuring models
models:
  sde_dbt_tutorial:
    bronze: # + => Applies to all models in this folder
      +materialized: table 
    silver:
      +materialized: table
    gold:
      marketing:
        +materialized: view

