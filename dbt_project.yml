---
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: sde_dbt_tutorial
version: 1.0.0
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: sde_dbt_tutorial

flags:
  send_anonymous_usage_stats: false

# These configurations specify where dbt should look
# for different types of files.
# The `model-paths` config, for example, states that
# models in this project can be found in the "models/" directory. You probably won't
# need to change these!
model-paths: [models]
analysis-paths: [analysis]
test-paths: [tests]
seed-paths: [data]
macro-paths: [macros]
snapshot-paths: [scd2]
target-path: target  # directory which will store compiled SQL files
clean-targets:  # directories to be removed by `dbt clean`
  - target
  - dbt_packages
  #
# Configuring models
models:
  sde_dbt_tutorial:
    bronze:
      +materialized: table
    silver:
      +materialized: table
    gold:
      marketing:
        +materialized: view

